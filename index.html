<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дроби · Наглядный тренажёр для 5–6 класса</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧮</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
*{margin:0;padding:0}
:root{
  --indigo:#6366f1;--indigo-dark:#4f46e5;--violet:#8b5cf6;
  --emerald:#10b981;--emerald-dark:#059669;
  --rose:#f43f5e;--rose-dark:#e11d48;--amber:#f59e0b;
  --slate-50:#f8fafc;--slate-100:#f1f5f9;--slate-200:#e2e8f0;--slate-300:#cbd5e1;
  --slate-500:#64748b;--slate-600:#475569;--slate-700:#334155;--slate-900:#0f172a;
  --radius:14px;--radius-lg:20px;--radius-xl:28px;
  --shadow:0 4px 12px rgba(15,23,42,.08);--shadow-lg:0 16px 40px rgba(15,23,42,.12);
}
html{min-height:100%}
body{
  font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:16px;line-height:1.5;color:var(--slate-900);
  background:linear-gradient(160deg,#eef2ff 0%,#faf5ff 50%,#fff1f2 100%);
  background-attachment:fixed;min-height:100vh;padding:24px 16px;
  -webkit-font-smoothing:antialiased;
}
.app{max-width:680px;margin:0 auto}
.hero,.card,.result{
  background:#fff;border-radius:var(--radius-xl);
  box-shadow:var(--shadow-lg);border:1px solid rgba(226,232,240,.8);
}
.hero{padding:48px 40px 40px;text-align:center}
.badge{
  display:inline-block;background:linear-gradient(135deg,rgba(99,102,241,.1),rgba(139,92,246,.1));
  color:var(--indigo-dark);font-size:.8125rem;font-weight:700;letter-spacing:.02em;
  padding:6px 14px;border-radius:100px;margin-bottom:20px;
  border:1px solid rgba(99,102,241,.2);
}
.hero h1{
  font-size:clamp(1.75rem,5vw,2.5rem);font-weight:800;letter-spacing:-.02em;line-height:1.15;
  background:linear-gradient(135deg,var(--slate-900),var(--indigo-dark));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  margin-bottom:16px;
}
.lead{font-size:1.0625rem;color:var(--slate-500);max-width:480px;margin:0 auto 32px;line-height:1.6}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:36px}
.feature{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:16px 12px;background:var(--slate-50);border-radius:var(--radius);
  font-size:.875rem;font-weight:600;color:var(--slate-700);border:1px solid var(--slate-100);
}
.feature .icon{font-size:1.5rem;line-height:1}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:16px 32px;font-family:inherit;font-size:1.0625rem;font-weight:700;
  border:none;border-radius:var(--radius);cursor:pointer;line-height:1.2;
  transition:transform .15s,box-shadow .15s,background .15s,border-color .15s;
  -webkit-tap-highlight-color:transparent;
}
.btn:active{transform:translateY(1px) scale(.995)}
.btn:focus-visible{outline:3px solid var(--indigo);outline-offset:3px}
.btn-primary{
  background:linear-gradient(135deg,var(--indigo),var(--violet));
  color:#fff;box-shadow:0 6px 20px rgba(99,102,241,.35);
}
.btn-primary:hover{box-shadow:0 8px 28px rgba(99,102,241,.45);transform:translateY(-1px)}
.btn-secondary{
  background:#fff;color:var(--slate-700);border:2px solid var(--slate-200);
  padding:14px 28px;font-size:1rem;
}
.btn-secondary:hover{border-color:var(--slate-300);background:var(--slate-50)}
.quiz-header{margin-bottom:20px;padding:0 4px}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;
  font-size:.9375rem;font-weight:700;color:var(--slate-600);margin-bottom:10px}
.quiz-score{color:var(--amber);font-weight:800;padding:4px 12px;
  background:rgba(245,158,11,.1);border-radius:100px}
.progress-bar{height:8px;background:var(--slate-200);border-radius:100px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--indigo),var(--violet));
  border-radius:100px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.card{padding:32px}
.question-prompt{font-size:1.25rem;font-weight:700;color:var(--slate-900);margin-bottom:20px;line-height:1.4}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;
  font-weight:700;line-height:1;padding:0 4px}
.frac .num{padding:0 4px 4px;border-bottom:2px solid currentColor}
.frac .den{padding:4px 4px 0}
.frac-bar{display:flex;height:52px;border-radius:var(--radius);overflow:hidden;
  border:2px solid var(--slate-300);background:var(--slate-50);width:100%}
.frac-seg{flex:1;background:transparent;transition:background .2s}
.frac-seg+.frac-seg{border-left:2px solid var(--slate-300)}
.frac-seg.filled{background:linear-gradient(135deg,var(--indigo),var(--violet))}
.frac-seg.filled-alt{background:linear-gradient(135deg,var(--amber),var(--rose))}
.compare-visual{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:24px 0}
.compare-item{display:flex;flex-direction:column;align-items:center;gap:10px}
.compare-label{font-size:1.375rem;font-weight:700}
.identify-visual{margin:24px 0}
.options{display:grid;gap:12px;margin:24px 0 0}
.fraction-options{grid-template-columns:repeat(2,1fr)}
@media(min-width:560px){.fraction-options{grid-template-columns:repeat(4,1fr)}}
.compare-options{grid-template-columns:repeat(3,1fr)}
.option{display:flex;align-items:center;justify-content:center;min-height:76px;
  padding:16px 12px;font-family:inherit;font-size:1.5rem;font-weight:700;color:var(--slate-900);
  background:#fff;border:2px solid var(--slate-200);border-radius:var(--radius);cursor:pointer;
  transition:all .15s;-webkit-tap-highlight-color:transparent}
.compare-options .option{font-size:2rem}
.option:hover:not(:disabled){border-color:var(--indigo);background:rgba(99,102,241,.04);
  transform:translateY(-2px)}
.option:active:not(:disabled){transform:translateY(0)}
.option:focus-visible{outline:3px solid var(--indigo);outline-offset:3px}
.option.correct{background:linear-gradient(135deg,rgba(16,185,129,.12),rgba(5,150,105,.12));
  border-color:var(--emerald);color:var(--emerald-dark);animation:pop .35s ease}
.option.wrong{background:linear-gradient(135deg,rgba(244,63,94,.1),rgba(225,29,72,.1));
  border-color:var(--rose);color:var(--rose-dark);animation:shake .4s ease}
.option.dimmed{opacity:.5}
.option:disabled{cursor:default}
@keyframes pop{50%{transform:scale(1.04)}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.feedback{display:flex;gap:14px;padding:18px 20px;border-radius:var(--radius);
  margin-top:24px;animation:slideUp .35s cubic-bezier(.4,0,.2,1)}
@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.feedback.ok{background:linear-gradient(135deg,rgba(16,185,129,.08),rgba(5,150,105,.08));
  border:1px solid rgba(16,185,129,.25)}
.feedback.bad{background:linear-gradient(135deg,rgba(244,63,94,.06),rgba(245,158,11,.06));
  border:1px solid rgba(244,63,94,.2)}
.feedback-icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:1.25rem;font-weight:800;flex-shrink:0;color:#fff}
.feedback.ok .feedback-icon{background:var(--emerald)}
.feedback.bad .feedback-icon{background:var(--rose)}
.feedback-body{flex:1}
.feedback-title{font-weight:800;font-size:1.0625rem;margin-bottom:4px}
.feedback.ok .feedback-title{color:var(--emerald-dark)}
.feedback.bad .feedback-title{color:var(--rose-dark)}
.feedback-text{color:var(--slate-700);font-size:.9375rem;line-height:1.5}
.next-wrap{margin-top:20px;display:flex;justify-content:flex-end}
.result{padding:48px 40px;text-align:center}
.result-emoji{font-size:4rem;line-height:1;margin-bottom:16px;display:block}
.result h2{font-size:clamp(1.5rem,4vw,2rem);font-weight:800;letter-spacing:-.02em;margin-bottom:8px}
.result-score{font-size:3rem;font-weight:800;margin:20px 0;
  background:linear-gradient(135deg,var(--indigo),var(--violet));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.result-streak{color:var(--amber);font-weight:700;margin-bottom:8px}
.result-message{color:var(--slate-500);font-size:1.0625rem;margin-bottom:32px;line-height:1.5}
.record-badge{
  display:inline-flex;align-items:center;gap:6px;
  background:linear-gradient(135deg,rgba(245,158,11,.15),rgba(244,63,94,.1));
  color:var(--amber);font-size:.875rem;font-weight:800;
  padding:6px 14px;border-radius:100px;margin-bottom:8px;
  border:1px solid rgba(245,158,11,.25);
}
.personal-best{color:var(--slate-500);font-size:.9375rem;margin-bottom:8px;font-weight:600}
.result-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:32px}
.topic-breakdown{
  margin-top:32px;padding-top:24px;border-top:1px solid var(--slate-100);text-align:left;
}
.topic-breakdown h3{
  font-size:.8125rem;font-weight:700;color:var(--slate-500);
  margin-bottom:16px;text-align:center;text-transform:uppercase;letter-spacing:.05em;
}
.topic-row{
  display:grid;grid-template-columns:24px 1fr 100px 48px;gap:12px;align-items:center;padding:10px 0;
}
.topic-icon{font-size:1.25rem;text-align:center}
.topic-name{font-size:.9375rem;font-weight:600;color:var(--slate-700)}
.topic-bar{height:8px;background:var(--slate-100);border-radius:100px;overflow:hidden}
.topic-fill{height:100%;border-radius:100px;transition:width .5s ease}
.topic-score{font-size:.875rem;font-weight:700;color:var(--slate-600);text-align:right;font-variant-numeric:tabular-nums}
.bar-legend{display:flex;gap:14px;justify-content:center;align-items:center;
  margin-top:14px;font-size:.9375rem;font-weight:600;color:var(--slate-600);flex-wrap:wrap}
.bar-legend span{display:inline-flex;align-items:center;gap:6px}
.bar-legend .plus,.bar-legend .eq{font-weight:800;font-size:1.125rem;color:var(--slate-500)}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block}
.dot-a{background:linear-gradient(135deg,var(--indigo),var(--violet))}
.dot-b{background:linear-gradient(135deg,var(--amber),var(--rose))}

/* ---------- History stats card ---------- */
.stats-card{margin-top:24px;padding:32px}
.stats-header{display:flex;justify-content:space-between;align-items:center;
  margin-bottom:20px;gap:12px;flex-wrap:wrap}
.stats-header h2{font-size:1.25rem;font-weight:800;letter-spacing:-.01em}
.stats-count{font-size:.8125rem;font-weight:700;color:var(--slate-500);
  background:var(--slate-100);padding:4px 12px;border-radius:100px;white-space:nowrap}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
.stat{padding:16px 10px;background:linear-gradient(135deg,var(--slate-50),#fff);
  border-radius:var(--radius);border:1px solid var(--slate-100);text-align:center}
.stat-value{font-size:1.5rem;font-weight:800;line-height:1.1;margin-bottom:4px;
  background:linear-gradient(135deg,var(--indigo),var(--violet));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.stat-label{font-size:.75rem;font-weight:600;color:var(--slate-500);
  text-transform:uppercase;letter-spacing:.03em}
.chart-wrap{margin-bottom:20px}
.chart-title{font-size:.875rem;font-weight:700;color:var(--slate-600);margin-bottom:8px}
.history-chart{width:100%;height:auto;display:block}
.chart-legend{display:flex;gap:16px;justify-content:center;margin-top:10px;
  font-size:.8125rem;font-weight:600;color:var(--slate-500);flex-wrap:wrap}
.chart-legend span{display:inline-flex;align-items:center;gap:6px}
.chart-legend .dot{width:10px;height:10px}
.weak-topic{
  display:flex;gap:14px;align-items:center;padding:14px 18px;
  background:linear-gradient(135deg,rgba(245,158,11,.08),rgba(244,63,94,.05));
  border:1px solid rgba(245,158,11,.2);border-radius:var(--radius);margin-bottom:16px;
}
.weak-icon{font-size:1.5rem;line-height:1}
.weak-title{font-size:.75rem;font-weight:700;color:var(--slate-500);
  text-transform:uppercase;letter-spacing:.05em}
.weak-body{font-size:.9375rem;color:var(--slate-700);margin-top:2px}
.stats-footer{text-align:center;padding-top:8px}
.link-btn{background:none;border:none;color:var(--slate-500);
  font-size:.8125rem;font-weight:600;cursor:pointer;padding:6px 12px;
  font-family:inherit;border-radius:8px;text-decoration:underline;
  text-decoration-color:var(--slate-300);text-underline-offset:3px}
.link-btn:hover{color:var(--rose);text-decoration-color:currentColor}
.link-btn:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
.app-footer{margin-top:24px;text-align:center;padding:16px 0;
  display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.app-footer .link-btn{font-size:.75rem;color:var(--slate-500);text-decoration:none}

@media(max-width:480px){
  body{padding:16px 12px}
  .hero,.result{padding:32px 24px;border-radius:var(--radius-lg)}
  .card{padding:24px 20px;border-radius:var(--radius-lg)}
  .features{grid-template-columns:1fr;gap:8px}
  .question-prompt{font-size:1.125rem}
  .frac-bar{height:44px}
  .option{min-height:68px;font-size:1.25rem}
  .next-wrap{justify-content:stretch}
  .next-wrap .btn{width:100%}
  .compare-visual{gap:12px}
  .feedback{padding:14px 16px;gap:10px}
  .stats-card{padding:24px 20px;border-radius:var(--radius-lg);margin-top:16px}
  .stats-grid{gap:8px}
  .stat{padding:12px 6px}
  .stat-value{font-size:1.25rem}
  .stat-label{font-size:.6875rem}
  .topic-row{grid-template-columns:20px 1fr 70px 44px;gap:8px}
  .topic-name{font-size:.875rem}
  .result-actions{flex-direction:column;align-items:stretch}
  .result-actions .btn{width:100%}
}
</style>
</head>
<body>
<main class="app" id="app" aria-live="polite"></main>
<script>
'use strict';
/* ---------- Утилиты ---------- */
const randInt = (min,max)=>Math.floor(Math.random()*(max-min+1))+min;
const shuffle = arr=>{const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const fracHTML = (n,d)=>`<span class="frac"><span class="num">${n}</span><span class="den">${d}</span></span>`;
const renderLabel = label=>{const m=String(label).match(/^(\d+)\/(\d+)$/);return m?fracHTML(m[1],m[2]):String(label);};
const fractionBar = (n,d)=>{let h='<div class="frac-bar">';for(let i=0;i<d;i++)h+=`<div class="frac-seg ${i<n?'filled':''}"></div>`;return h+'</div>';};
const fractionBarDual = (n1,n2,d)=>{let h='<div class="frac-bar">';for(let i=0;i<d;i++){const cls=i<n1?'filled':(i<n1+n2?'filled-alt':'');h+=`<div class="frac-seg ${cls}"></div>`;}return h+'</div>';};
const plural = (n,one,few,many)=>{
  const a=Math.abs(n)%100, b=a%10;
  if(a>10 && a<20) return many;
  if(b>1 && b<5) return few;
  if(b===1) return one;
  return many;
};

/* ---------- Дроби: равенство по значению ---------- */
const fracEq = (a,b)=>{
  try{
    const [an,ad]=String(a).split('/').map(Number);
    const [bn,bd]=String(b).split('/').map(Number);
    if(!ad||!bd) return false;
    return an*bd===bn*ad;
  }catch{return false;}
};
const distinct = (list,correct)=>{
  const out=[];
  for(const c of list){
    if(fracEq(c,correct)) continue;
    if(out.some(x=>fracEq(x,c))) continue;
    out.push(c);
  }
  return out;
};
const FORCE_POOL = ['1/2','1/3','2/3','1/4','3/4','1/5','2/5','3/5','4/5','1/6','5/6','2/7','5/7','3/8','7/8'];

/* ---------- Темы ---------- */
const TOPICS = {
  compare:  {label:'Сравнение',        icon:'⚖️'},
  identify: {label:'Дробь по картинке',icon:'🔍'},
  add:      {label:'Сложение',         icon:'➕'}
};

/* ---------- Хранилище истории ---------- */
const STORAGE_KEY = 'fractions-trainer-history-v1';
function loadHistory(){
  try{const raw=localStorage.getItem(STORAGE_KEY);const h=raw?JSON.parse(raw):[];return Array.isArray(h)?h:[];}
  catch{return[];}
}
function saveRun(run){
  try{
    const h=loadHistory();
    h.push(run);
    if(h.length>50) h.shift();
    localStorage.setItem(STORAGE_KEY,JSON.stringify(h));
  }catch{}
}
function clearHistory(){try{localStorage.removeItem(STORAGE_KEY);}catch{}}
function aggregateTopics(runs){
  const agg={compare:{correct:0,total:0},identify:{correct:0,total:0},add:{correct:0,total:0}};
  runs.forEach(run=>{
    if(!run.byTopic) return;
    Object.keys(run.byTopic).forEach(k=>{
      if(agg[k]){
        agg[k].correct += run.byTopic[k].correct||0;
        agg[k].total   += run.byTopic[k].total||0;
      }
    });
  });
  return agg;
}
function findWeakest(agg){
  let weakest=null;
  Object.entries(agg).forEach(([k,v])=>{
    if(v.total<2) return;
    const ratio=v.correct/v.total;
    if(ratio>=0.9) return;
    if(!weakest || ratio<weakest.ratio) weakest={topic:k,ratio,...v};
  });
  return weakest;
}

/* ---------- Генераторы заданий ---------- */
function makeCompare(){
  if(Math.random()<0.15){
    const d=randInt(2,5), n=randInt(1,d-1);
    return buildCompare({n,d},{n:n*2,d:d*2},true);
  }
  let a,b,cmp,attempts=0;
  do{
    const d1=randInt(2,8), n1=randInt(1,d1-1);
    const d2=randInt(2,8), n2=randInt(1,d2-1);
    if(d1===d2 && n1===n2){attempts++;continue;}
    a={n:n1,d:d1}; b={n:n2,d:d2};
    cmp=a.n*b.d-b.n*a.d; attempts++;
  } while(cmp===0 && attempts<15);
  return buildCompare(a,b,false);
}
function buildCompare(a,b,isEqual){
  const diff=a.n*b.d-b.n*a.d;
  const sym=diff<0?'<':diff>0?'>':'=';
  const options=[
    {label:'<',correct:diff<0},
    {label:'=',correct:diff===0},
    {label:'>',correct:diff>0}
  ];
  let explanation;
  if(isEqual||diff===0){
    explanation=`${a.n}/${a.d} и ${b.n}/${b.d} — равные дроби. Если умножить числитель и знаменатель на одно и то же число, значение не меняется.`;
  } else if(a.d===b.d){
    explanation=`Знаменатели одинаковые, сравниваем числители: ${a.n} ${sym} ${b.n}. Значит, ${a.n}/${a.d} ${sym} ${b.n}/${b.d}.`;
  } else if(a.n===b.n){
    explanation=`Числители одинаковые. Чем больше знаменатель, тем меньше каждая часть. Поэтому ${a.n}/${a.d} ${sym} ${b.n}/${b.d}.`;
  } else {
    explanation=`Посмотри на полоски: у ${diff<0?'первой':'второй'} дроби закрашено меньше. Значит, ${a.n}/${a.d} ${sym} ${b.n}/${b.d}.`;
  }
  return {
    type:'compare',
    prompt:'Поставь знак сравнения:',
    visual:`
      <div class="compare-visual">
        <div class="compare-item">${fractionBar(a.n,a.d)}<div class="compare-label">${fracHTML(a.n,a.d)}</div></div>
        <div class="compare-item">${fractionBar(b.n,b.d)}<div class="compare-label">${fracHTML(b.n,b.d)}</div></div>
      </div>`,
    options, explanation
  };
}

/* forcedD — только для диагностики; в обычном режиме undefined */
function makeIdentify(forcedD){
  const d=forcedD || randInt(2,8);
  const n=randInt(1,d-1);
  const correct=`${n}/${d}`;
  const cand=new Set();
  if(d-n>0 && d-n!==n) cand.add(`${d-n}/${d}`);
  if(d+1<=10) cand.add(`${n}/${d+1}`);
  if(d-1>=2) cand.add(`${n}/${d-1}`);
  cand.add(`${d}/${n}`);
  if(n+1<d) cand.add(`${n+1}/${d}`);
  if(n-1>0) cand.add(`${n-1}/${d}`);

  let distractors = distinct(shuffle([...cand]), correct).slice(0,3);

  let guard=0;
  while(distractors.length<3 && guard++<300){
    const dd=randInt(2,10);
    const nn=randInt(1,dd-1);
    const c=`${nn}/${dd}`;
    if(fracEq(c,correct)) continue;
    if(distractors.some(x=>fracEq(x,c))) continue;
    distractors.push(c);
  }

  if(distractors.length<3){
    for(const c of FORCE_POOL){
      if(distractors.length>=3) break;
      if(fracEq(c,correct)) continue;
      if(distractors.some(x=>fracEq(x,c))) continue;
      distractors.push(c);
    }
  }

  const options=shuffle([correct,...distractors]).map(o=>({label:o,correct:o===correct}));
  return {
    type:'identify',
    prompt:'Какая дробь закрашена?',
    visual:`<div class="identify-visual">${fractionBar(n,d)}</div>`,
    options,
    explanation:`Полоска разделена на ${d} равных частей, закрашено ${n}. Значит, закрашено ${n}/${d} всей полоски.`
  };
}

/* forcedD — только для диагностики; в обычном режиме undefined */
function makeAdd(forcedD){
  const d=forcedD || randInt(3,9);
  const n1=randInt(1,Math.floor((d-1)/2));
  const n2=randInt(1,Math.floor((d-1)/2));
  const sum=n1+n2, correct=`${sum}/${d}`;
  const cand=new Set();
  cand.add(`${sum}/${d+d}`);
  if(sum+1<d) cand.add(`${sum+1}/${d}`);
  if(sum-1>0) cand.add(`${sum-1}/${d}`);
  cand.add(`${n1*n2}/${d}`);

  let distractors = distinct(shuffle([...cand]), correct).slice(0,3);

  let guard=0;
  while(distractors.length<3 && guard++<300){
    const dd=randInt(2,10);
    const nn=randInt(1,dd-1);
    const c=`${nn}/${dd}`;
    if(fracEq(c,correct)) continue;
    if(distractors.some(x=>fracEq(x,c))) continue;
    distractors.push(c);
  }

  if(distractors.length<3){
    for(const c of FORCE_POOL){
      if(distractors.length>=3) break;
      if(fracEq(c,correct)) continue;
      if(distractors.some(x=>fracEq(x,c))) continue;
      distractors.push(c);
    }
  }

  const options=shuffle([correct,...distractors]).map(o=>({label:o,correct:o===correct}));
  return {
    type:'add',
    prompt:'Сложи дроби:',
    visual:`
      <div class="identify-visual">
        ${fractionBarDual(n1,n2,d)}
        <div class="bar-legend">
          <span><i class="dot dot-a"></i>${fracHTML(n1,d)}</span>
          <span class="plus">+</span>
          <span><i class="dot dot-b"></i>${fracHTML(n2,d)}</span>
          <span class="eq">= ?</span>
        </div>
      </div>`,
    options,
    explanation:`Знаменатели одинаковые, поэтому складываем числители: ${n1} + ${n2} = ${sum}. Получаем ${sum}/${d}.`
  };
}

function buildQuestionSet(){
  const gens=[makeCompare,makeCompare,makeIdentify,makeIdentify,makeAdd,makeAdd];
  const shuffled=shuffle(gens);
  const qs=[];
  for(let i=0;i<8;i++) qs.push(shuffled[i%shuffled.length]());
  return qs;
}

/* ---------- Состояние ---------- */
const state={
  screen:'start', questions:[], current:0, score:0,
  bestStreak:0, streak:0, answered:false, selectedIndex:null,
  byTopic:{},
  isRecord:false, prevBest:null
};

/* ---------- Рендеринг ---------- */
function render(){
  const app=document.getElementById('app');
  if(state.screen==='start') app.innerHTML=renderStart();
  else if(state.screen==='quiz') app.innerHTML=renderQuiz();
  else app.innerHTML=renderResult();
}

function renderStart(){
  const history=loadHistory();
  return `
    <section class="hero">
      <div class="badge">Математика · 5–6 класс</div>
      <h1>Дроби без стресса</h1>
      <p class="lead">
        8 коротких заданий, чтобы разобраться в сравнении, записи и сложении дробей.
        Наглядные полоски и понятное объяснение после каждого ответа — а не просто «правильно / неправильно».
      </p>
      <div class="features">
        <div class="feature"><span class="icon">👀</span>Наглядные полоски</div>
        <div class="feature"><span class="icon">💡</span>Объяснения после ответа</div>
        <div class="feature"><span class="icon">📊</span>История прогресса</div>
      </div>
      <button class="btn btn-primary" data-action="start">Начать тренировку →</button>
    </section>
    ${history.length ? renderStatsCard(history) : ''}
    <div class="app-footer">
      <button class="link-btn" data-action="diagnostics" title="Прогнать 5000 генераций каждого типа">Диагностика</button>
    </div>
  `;
}

function renderStatsCard(history){
  const attempts=history.length;
  const best=Math.max(...history.map(r=>r.score/r.total));
  const avg=history.reduce((s,r)=>s+r.score/r.total,0)/attempts;
  const agg=aggregateTopics(history);
  const weak=findWeakest(agg);
  const lastN=Math.min(history.length,10);

  return `
    <section class="card stats-card">
      <div class="stats-header">
        <h2>📊 Твоя история</h2>
        <span class="stats-count">${attempts} ${plural(attempts,'попытка','попытки','попыток')}</span>
      </div>
      <div class="stats-grid">
        <div class="stat">
          <div class="stat-value">${Math.round(best*100)}%</div>
          <div class="stat-label">Лучший</div>
        </div>
        <div class="stat">
          <div class="stat-value">${Math.round(avg*100)}%</div>
          <div class="stat-label">В среднем</div>
        </div>
        <div class="stat">
          <div class="stat-value">${attempts}</div>
          <div class="stat-label">Попыток</div>
        </div>
      </div>
      <div class="chart-wrap">
        <div class="chart-title">Последние ${lastN} ${plural(lastN,'прохождение','прохождения','прохождений')}</div>
        ${renderHistoryChart(history)}
        <div class="chart-legend">
          <span><i class="dot" style="background:var(--rose)"></i>≤50%</span>
          <span><i class="dot" style="background:var(--amber)"></i>50–75%</span>
          <span><i class="dot" style="background:var(--emerald)"></i>≥75%</span>
        </div>
      </div>
      ${weak?renderWeakTopic(weak):''}
      <div class="stats-footer">
        <button class="link-btn" data-action="reset-history">Сбросить историю</button>
      </div>
    </section>
  `;
}

function renderWeakTopic(weak){
  const t=TOPICS[weak.topic];
  return `
    <div class="weak-topic">
      <span class="weak-icon">🎯</span>
      <div>
        <div class="weak-title">Слабое место</div>
        <div class="weak-body">${t.icon} <strong>${t.label}</strong> — ${weak.correct} из ${weak.total} верно (${Math.round(weak.ratio*100)}%)</div>
      </div>
    </div>
  `;
}

function renderHistoryChart(history){
  const last=history.slice(-10);
  const W=300, H=120, TOP=20, BOTTOM=110, BAR_MAX_H=BOTTOM-TOP;
  const barW=22, gap=6;
  const totalW=last.length*barW+(last.length-1)*gap;
  const startX=(W-totalW)/2;
  let bars='';
  const gridY=TOP+BAR_MAX_H*0.5;
  bars+=`<line x1="0" y1="${gridY}" x2="${W}" y2="${gridY}" stroke="#e2e8f0" stroke-dasharray="4 4" stroke-width="1"/>`;
  last.forEach((run,i)=>{
    const pct=run.score/run.total;
    const barH=Math.max(4,pct*BAR_MAX_H);
    const x=startX+i*(barW+gap);
    const y=BOTTOM-barH;
    const color=pct>=0.75?'#10b981':pct>=0.5?'#f59e0b':'#f43f5e';
    const when=new Date(run.ts||Date.now()).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
    bars+=`<rect x="${x}" y="${y}" width="${barW}" height="${barH}" rx="3" fill="${color}">
      <title>${when} — ${run.score}/${run.total} (${Math.round(pct*100)}%)</title>
    </rect>`;
    bars+=`<text x="${x+barW/2}" y="${y-4}" text-anchor="middle" font-size="9" font-weight="700"
             fill="#475569" font-family="Manrope,sans-serif">${Math.round(pct*100)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="history-chart" role="img" aria-label="История прохождений">${bars}</svg>`;
}

function renderQuiz(){
  const q=state.questions[state.current];
  const total=state.questions.length;
  const progress=((state.current+(state.answered?1:0))/total)*100;
  const isCompare=q.type==='compare';
  return `
    <div class="quiz-header">
      <div class="quiz-meta">
        <span class="quiz-step">Задание ${state.current+1} из ${total}</span>
        <span class="quiz-score">⭐ ${state.score}</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
    </div>
    <section class="card">
      <div class="question-prompt">${q.prompt}</div>
      ${q.visual||''}
      <div class="options ${isCompare?'compare-options':'fraction-options'}">
        ${q.options.map((o,i)=>renderOption(o,i)).join('')}
      </div>
      ${state.answered?renderFeedback(q):''}
    </section>`;
}

function renderOption(o,i){
  let cls='option';
  if(state.answered){
    if(o.correct) cls+=' correct';
    else if(i===state.selectedIndex) cls+=' wrong';
    else cls+=' dimmed';
  }
  return `<button class="${cls}" data-action="answer" data-index="${i}" ${state.answered?'disabled':''}>${renderLabel(o.label)}</button>`;
}

function renderFeedback(q){
  const ok=q.options[state.selectedIndex].correct;
  const isLast=state.current===state.questions.length-1;
  return `
    <div class="feedback ${ok?'ok':'bad'}">
      <div class="feedback-icon">${ok?'✓':'✗'}</div>
      <div class="feedback-body">
        <div class="feedback-title">${ok?'Верно!':'Не совсем'}</div>
        <div class="feedback-text">${q.explanation}</div>
      </div>
    </div>
    <div class="next-wrap">
      <button class="btn btn-primary" data-action="next">
        ${isLast?'Показать результат →':'Следующее задание →'}
      </button>
    </div>`;
}

function renderResult(){
  const total=state.questions.length;
  const pct=Math.round((state.score/total)*100);
  let emoji,title,message;
  if(pct===100){emoji='🏆';title='Идеально!';message='Все 8 из 8. Ты уверенно разбираешься в дробях!';}
  else if(pct>=75){emoji='🌟';title='Отличный результат!';message='Дроби почти освоены. Ещё немного практики — и будет идеально.';}
  else if(pct>=50){emoji='👍';title='Хороший старт!';message='Уже многое получается. Пройди ещё раз — и результат вырастет.';}
  else{emoji='💪';title='Главное — практика';message='Дроби — это навык. Попробуй ещё раз: с каждым проходом будет понятнее.';}

  const topicsHtml=Object.entries(state.byTopic).map(([k,v])=>{
    const t=TOPICS[k];
    const p=v.total?Math.round(v.correct/v.total*100):0;
    const color=p>=75?'var(--emerald)':p>=50?'var(--amber)':'var(--rose)';
    return `
      <div class="topic-row">
        <span class="topic-icon">${t.icon}</span>
        <span class="topic-name">${t.label}</span>
        <div class="topic-bar"><div class="topic-fill" style="width:${p}%;background:${color}"></div></div>
        <span class="topic-score">${v.correct}/${v.total}</span>
      </div>
    `;
  }).join('');

  return `
    <section class="result">
      <span class="result-emoji">${emoji}</span>
      <h2>${title}</h2>
      ${state.isRecord?'<div class="record-badge">🏆 Новый рекорд!</div>':(
        state.prevBest!==null?`<div class="personal-best">Личный рекорд: ${Math.round(state.prevBest*100)}%</div>`:''
      )}
      <div class="result-score">${state.score} / ${total}</div>
      ${state.bestStreak>=3?`<p class="result-streak">🔥 Лучшая серия подряд: ${state.bestStreak}</p>`:''}
      <p class="result-message">${message}</p>
      ${topicsHtml?`
        <div class="topic-breakdown">
          <h3>Результаты по темам</h3>
          ${topicsHtml}
        </div>
      `:''}
      <div class="result-actions">
        <button class="btn btn-primary" data-action="restart">Пройти ещё раз →</button>
        <button class="btn btn-secondary" data-action="home">К истории</button>
      </div>
    </section>`;
}

/* ---------- Диагностика ---------- */
function runDiagnostics(){
  const issues=[];
  const checkQuestion=(q,name)=>{
    if(!q.options || q.options.length!==4){
      issues.push(`${name}: options.length=${q.options?q.options.length:'null'} (ожидалось 4)`);
      return;
    }
    const correctCount=q.options.filter(o=>o.correct).length;
    if(correctCount!==1) issues.push(`${name}: correct count=${correctCount} (ожидалось 1)`);
    const labels=q.options.map(o=>o.label);
    for(let a=0;a<labels.length;a++){
      for(let b=a+1;b<labels.length;b++){
        if(fracEq(labels[a],labels[b])) issues.push(`${name}: дубли по значению ${labels[a]} = ${labels[b]}`);
      }
    }
  };
  const test=()=>{
    let start=performance.now();
    for(let i=0;i<5000;i++){
      if(i<200) continue; // пропускаем прогрев
      checkQuestion(makeCompare(),'makeCompare');
    }
    const tCompare=performance.now()-start;

    start=performance.now();
    for(let i=0;i<5000;i++) checkQuestion(makeIdentify(),'makeIdentify');
    const tIdentify=performance.now()-start;

    start=performance.now();
    for(let i=0;i<5000;i++) checkQuestion(makeAdd(),'makeAdd');
    const tAdd=performance.now()-start;

    // Явная регрессия бага: d=3 у makeAdd
    start=performance.now();
    for(let i=0;i<5000;i++) checkQuestion(makeAdd(3),'makeAdd(d=3)');
    const tAddD3=performance.now()-start;

    // Границы makeIdentify
    start=performance.now();
    for(let i=0;i<2000;i++){checkQuestion(makeIdentify(2),'makeIdentify(d=2)');}
    for(let i=0;i<2000;i++){checkQuestion(makeIdentify(8),'makeIdentify(d=8)');}
    const tIdentifyEdge=performance.now()-start;

    return {tCompare,tIdentify,tAdd,tAddD3,tIdentifyEdge};
  };
  const times=test();
  return {issues:issues.slice(0,10), total:issues.length, times};
}

/* ---------- Действия ---------- */
function startGame(){
  state.questions=buildQuestionSet();
  state.current=0; state.score=0; state.streak=0; state.bestStreak=0;
  state.answered=false; state.selectedIndex=null; state.screen='quiz';
  state.byTopic={};
  state.isRecord=false; state.prevBest=null;
  render();
}
function answer(index){
  if(state.answered) return;
  const q=state.questions[state.current];
  state.answered=true;
  state.selectedIndex=index;
  const ok=q.options[index].correct;
  const topic=q.type;
  if(!state.byTopic[topic]) state.byTopic[topic]={correct:0,total:0};
  state.byTopic[topic].total++;
  if(ok){
    state.score++;
    state.streak++;
    state.byTopic[topic].correct++;
    if(state.streak>state.bestStreak) state.bestStreak=state.streak;
  } else {
    state.streak=0;
  }
  render();
}
function next(){
  if(!state.answered) return;
  if(state.current===state.questions.length-1){
    const prevHistory=loadHistory();
    const prevBest=prevHistory.length?Math.max(...prevHistory.map(r=>r.score/r.total)):0;
    const currentPct=state.score/state.questions.length;
    state.isRecord=prevHistory.length>0 && currentPct>prevBest;
    state.prevBest=prevHistory.length>0?prevBest:null;
    saveRun({
      ts:Date.now(),
      score:state.score,
      total:state.questions.length,
      byTopic:state.byTopic
    });
    state.screen='result';
  } else {
    state.current++;
    state.answered=false;
    state.selectedIndex=null;
  }
  render();
}

/* ---------- События ---------- */
document.getElementById('app').addEventListener('click',e=>{
  const btn=e.target.closest('[data-action]');
  if(!btn) return;
  const a=btn.dataset.action;
  if(a==='start'||a==='restart') startGame();
  else if(a==='answer') answer(Number(btn.dataset.index));
  else if(a==='next') next();
  else if(a==='home'){ state.screen='start'; render(); }
  else if(a==='reset-history'){
    if(confirm('Удалить всю историю прохождений? Это действие нельзя отменить.')){
      clearHistory(); render();
    }
  }
  else if(a==='diagnostics'){
    btn.disabled=true; btn.textContent='Проверяем…';
    // даём браузеру отрисовать состояние, потом запускаем тест
    setTimeout(()=>{
      const r=runDiagnostics();
      const t=r.times;
      const summary=`makeCompare: ${Math.round(t.tCompare)}мс | makeIdentify: ${Math.round(t.tIdentify)}мс | makeAdd: ${Math.round(t.tAdd)}мс\nmakeAdd(d=3): ${Math.round(t.tAddD3)}мс | makeIdentify(d=2/8): ${Math.round(t.tIdentifyEdge)}мс`;
      if(r.total===0){
        alert('✅ Диагностика пройдена\n\n'+summary);
      } else {
        alert(`⚠️ Найдено ${r.total} проблем\n\n${r.issues.join('\n')}\n\n${summary}`);
      }
      btn.disabled=false; btn.textContent='Диагностика';
    },20);
  }
});
document.addEventListener('keydown',e=>{
  if(state.screen!=='quiz') return;
  const q=state.questions[state.current];
  if(!state.answered){
    const n=parseInt(e.key,10);
    if(n>=1 && n<=q.options.length){e.preventDefault();answer(n-1);}
  } else if(e.key==='Enter'||e.key===' '){e.preventDefault();next();}
});

render();
</script>
