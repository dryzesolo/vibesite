<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дроби · Наглядный тренажёр для 5–6 класса</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧮</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
*{margin:0;padding:0}
:root{
  --indigo:#6366f1;--indigo-dark:#4f46e5;--violet:#8b5cf6;
  --emerald:#10b981;--emerald-dark:#059669;
  --rose:#f43f5e;--rose-dark:#e11d48;--amber:#f59e0b;
  --slate-50:#f8fafc;--slate-100:#f1f5f9;--slate-200:#e2e8f0;--slate-300:#cbd5e1;
  --slate-500:#64748b;--slate-600:#475569;--slate-700:#334155;--slate-900:#0f172a;
  --radius:14px;--radius-lg:20px;--radius-xl:28px;
  --shadow:0 4px 12px rgba(15,23,42,.08);--shadow-lg:0 16px 40px rgba(15,23,42,.12);
}
html{min-height:100%}
body{
  font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:16px;line-height:1.5;color:var(--slate-900);
  background:linear-gradient(160deg,#eef2ff 0%,#faf5ff 50%,#fff1f2 100%);
  background-attachment:fixed;min-height:100vh;padding:24px 16px;
  -webkit-font-smoothing:antialiased;
}
.app{max-width:680px;margin:0 auto}
.hero,.card,.result{
  background:#fff;border-radius:var(--radius-xl);
  box-shadow:var(--shadow-lg);border:1px solid rgba(226,232,240,.8);
}
.hero{padding:48px 40px 40px;text-align:center}
.badge{
  display:inline-block;background:linear-gradient(135deg,rgba(99,102,241,.1),rgba(139,92,246,.1));
  color:var(--indigo-dark);font-size:.8125rem;font-weight:700;letter-spacing:.02em;
  padding:6px 14px;border-radius:100px;margin-bottom:20px;
  border:1px solid rgba(99,102,241,.2);
}
.hero h1{
  font-size:clamp(1.75rem,5vw,2.5rem);font-weight:800;letter-spacing:-.02em;line-height:1.15;
  background:linear-gradient(135deg,var(--slate-900),var(--indigo-dark));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  margin-bottom:16px;
}
.lead{font-size:1.0625rem;color:var(--slate-500);max-width:480px;margin:0 auto 32px;line-height:1.6}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:36px}
.feature{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:16px 12px;background:var(--slate-50);border-radius:var(--radius);
  font-size:.875rem;font-weight:600;color:var(--slate-700);border:1px solid var(--slate-100);
}
.feature .icon{font-size:1.5rem;line-height:1}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:16px 32px;font-family:inherit;font-size:1.0625rem;font-weight:700;
  border:none;border-radius:var(--radius);cursor:pointer;line-height:1.2;
  transition:transform .15s,box-shadow .15s;-webkit-tap-highlight-color:transparent;
}
.btn:active{transform:translateY(1px) scale(.995)}
.btn:focus-visible{outline:3px solid var(--indigo);outline-offset:3px}
.btn-primary{
  background:linear-gradient(135deg,var(--indigo),var(--violet));
  color:#fff;box-shadow:0 6px 20px rgba(99,102,241,.35);
}
.btn-primary:hover{box-shadow:0 8px 28px rgba(99,102,241,.45);transform:translateY(-1px)}
.quiz-header{margin-bottom:20px;padding:0 4px}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;
  font-size:.9375rem;font-weight:700;color:var(--slate-600);margin-bottom:10px}
.quiz-score{color:var(--amber);font-weight:800;padding:4px 12px;
  background:rgba(245,158,11,.1);border-radius:100px}
.progress-bar{height:8px;background:var(--slate-200);border-radius:100px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--indigo),var(--violet));
  border-radius:100px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.card{padding:32px}
.question-prompt{font-size:1.25rem;font-weight:700;color:var(--slate-900);margin-bottom:20px;line-height:1.4}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;
  font-weight:700;line-height:1;padding:0 4px}
.frac .num{padding:0 4px 4px;border-bottom:2px solid currentColor}
.frac .den{padding:4px 4px 0}
.frac-bar{display:flex;height:52px;border-radius:var(--radius);overflow:hidden;
  border:2px solid var(--slate-300);background:var(--slate-50);width:100%}
.frac-seg{flex:1;background:transparent;transition:background .2s}
.frac-seg+.frac-seg{border-left:2px solid var(--slate-300)}
.frac-seg.filled{background:linear-gradient(135deg,var(--indigo),var(--violet))}
.frac-seg.filled-alt{background:linear-gradient(135deg,var(--amber),var(--rose))}
.compare-visual{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:24px 0}
.compare-item{display:flex;flex-direction:column;align-items:center;gap:10px}
.compare-label{font-size:1.375rem;font-weight:700}
.identify-visual{margin:24px 0}
.options{display:grid;gap:12px;margin:24px 0 0}
.fraction-options{grid-template-columns:repeat(2,1fr)}
@media(min-width:560px){.fraction-options{grid-template-columns:repeat(4,1fr)}}
.compare-options{grid-template-columns:repeat(3,1fr)}
.option{display:flex;align-items:center;justify-content:center;min-height:76px;
  padding:16px 12px;font-family:inherit;font-size:1.5rem;font-weight:700;color:var(--slate-900);
  background:#fff;border:2px solid var(--slate-200);border-radius:var(--radius);cursor:pointer;
  transition:all .15s;-webkit-tap-highlight-color:transparent}
.compare-options .option{font-size:2rem}
.option:hover:not(:disabled){border-color:var(--indigo);background:rgba(99,102,241,.04);
  transform:translateY(-2px)}
.option:active:not(:disabled){transform:translateY(0)}
.option:focus-visible{outline:3px solid var(--indigo);outline-offset:3px}
.option.correct{background:linear-gradient(135deg,rgba(16,185,129,.12),rgba(5,150,105,.12));
  border-color:var(--emerald);color:var(--emerald-dark);animation:pop .35s ease}
.option.wrong{background:linear-gradient(135deg,rgba(244,63,94,.1),rgba(225,29,72,.1));
  border-color:var(--rose);color:var(--rose-dark);animation:shake .4s ease}
.option.dimmed{opacity:.5}
.option:disabled{cursor:default}
@keyframes pop{50%{transform:scale(1.04)}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.feedback{display:flex;gap:14px;padding:18px 20px;border-radius:var(--radius);
  margin-top:24px;animation:slideUp .35s cubic-bezier(.4,0,.2,1)}
@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.feedback.ok{background:linear-gradient(135deg,rgba(16,185,129,.08),rgba(5,150,105,.08));
  border:1px solid rgba(16,185,129,.25)}
.feedback.bad{background:linear-gradient(135deg,rgba(244,63,94,.06),rgba(245,158,11,.06));
  border:1px solid rgba(244,63,94,.2)}
.feedback-icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:1.25rem;font-weight:800;flex-shrink:0;color:#fff}
.feedback.ok .feedback-icon{background:var(--emerald)}
.feedback.bad .feedback-icon{background:var(--rose)}
.feedback-body{flex:1}
.feedback-title{font-weight:800;font-size:1.0625rem;margin-bottom:4px}
.feedback.ok .feedback-title{color:var(--emerald-dark)}
.feedback.bad .feedback-title{color:var(--rose-dark)}
.feedback-text{color:var(--slate-700);font-size:.9375rem;line-height:1.5}
.next-wrap{margin-top:20px;display:flex;justify-content:flex-end}
.result{padding:48px 40px;text-align:center}
.result-emoji{font-size:4rem;line-height:1;margin-bottom:16px;display:block}
.result h2{font-size:clamp(1.5rem,4vw,2rem);font-weight:800;letter-spacing:-.02em;margin-bottom:8px}
.result-score{font-size:3rem;font-weight:800;margin:20px 0;
  background:linear-gradient(135deg,var(--indigo),var(--violet));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.result-streak{color:var(--amber);font-weight:700;margin-bottom:8px}
.result-message{color:var(--slate-500);font-size:1.0625rem;margin-bottom:32px;line-height:1.5}
.bar-legend{display:flex;gap:14px;justify-content:center;align-items:center;
  margin-top:14px;font-size:.9375rem;font-weight:600;color:var(--slate-600);flex-wrap:wrap}
.bar-legend span{display:inline-flex;align-items:center;gap:6px}
.bar-legend .plus,.bar-legend .eq{font-weight:800;font-size:1.125rem;color:var(--slate-500)}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block}
.dot-a{background:linear-gradient(135deg,var(--indigo),var(--violet))}
.dot-b{background:linear-gradient(135deg,var(--amber),var(--rose))}
@media(max-width:480px){
  body{padding:16px 12px}
  .hero,.result{padding:32px 24px;border-radius:var(--radius-lg)}
  .card{padding:24px 20px;border-radius:var(--radius-lg)}
  .features{grid-template-columns:1fr;gap:8px}
  .question-prompt{font-size:1.125rem}
  .frac-bar{height:44px}
  .option{min-height:68px;font-size:1.25rem}
  .next-wrap{justify-content:stretch}
  .next-wrap .btn{width:100%}
  .compare-visual{gap:12px}
  .feedback{padding:14px 16px;gap:10px}
}
</style>
</head>
<body>
<main class="app" id="app" aria-live="polite"></main>
<script>
'use strict';
/* ---------- Утилиты ---------- */
const randInt = (min,max)=>Math.floor(Math.random()*(max-min+1))+min;
const shuffle = arr=>{const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const fracHTML = (n,d)=>`<span class="frac"><span class="num">${n}</span><span class="den">${d}</span></span>`;
const renderLabel = label=>{const m=String(label).match(/^(\d+)\/(\d+)$/);return m?fracHTML(m[1],m[2]):String(label);};
const fractionBar = (n,d)=>{let h='<div class="frac-bar">';for(let i=0;i<d;i++)h+=`<div class="frac-seg ${i<n?'filled':''}"></div>`;return h+'</div>';};
const fractionBarDual = (n1,n2,d)=>{let h='<div class="frac-bar">';for(let i=0;i<d;i++){const cls=i<n1?'filled':(i<n1+n2?'filled-alt':'');h+=`<div class="frac-seg ${cls}"></div>`;}return h+'</div>';};

/* ---------- Генераторы заданий ---------- */
function makeCompare(){
  if(Math.random()<0.15){
    const d=randInt(2,5), n=randInt(1,d-1);
    return buildCompare({n,d},{n:n*2,d:d*2},true);
  }
  let a,b,cmp,attempts=0;
  do{
    const d1=randInt(2,8), n1=randInt(1,d1-1);
    const d2=randInt(2,8), n2=randInt(1,d2-1);
    if(d1===d2 && n1===n2){attempts++;continue;}
    a={n:n1,d:d1}; b={n:n2,d:d2};
    cmp=a.n*b.d-b.n*a.d; attempts++;
  } while(cmp===0 && attempts<15);
  return buildCompare(a,b,false);
}
function buildCompare(a,b,isEqual){
  const diff=a.n*b.d-b.n*a.d;
  const sym=diff<0?'<':diff>0?'>':'=';
  const options=[
    {label:'<',correct:diff<0},
    {label:'=',correct:diff===0},
    {label:'>',correct:diff>0}
  ];
  let explanation;
  if(isEqual||diff===0){
    explanation=`${a.n}/${a.d} и ${b.n}/${b.d} — это равные дроби. Если умножить числитель и знаменатель на одно и то же число, значение не меняется.`;
  } else if(a.d===b.d){
    explanation=`Знаменатели одинаковые, сравниваем числители: ${a.n} ${sym} ${b.n}. Значит, ${a.n}/${a.d} ${sym} ${b.n}/${b.d}.`;
  } else if(a.n===b.n){
    explanation=`Числители одинаковые. Чем больше знаменатель, тем меньше каждая часть. Поэтому ${a.n}/${a.d} ${sym} ${b.n}/${b.d}.`;
  } else {
    explanation=`Посмотри на полоски: у ${diff<0?'первой':'второй'} дроби закрашено меньше. Значит, ${a.n}/${a.d} ${sym} ${b.n}/${b.d}.`;
  }
  return {
    type:'compare',
    prompt:'Поставь знак сравнения:',
    visual:`
      <div class="compare-visual">
        <div class="compare-item">${fractionBar(a.n,a.d)}<div class="compare-label">${fracHTML(a.n,a.d)}</div></div>
        <div class="compare-item">${fractionBar(b.n,b.d)}<div class="compare-label">${fracHTML(b.n,b.d)}</div></div>
      </div>`,
    options, explanation
  };
}

function makeIdentify(){
  const d=randInt(2,8), n=randInt(1,d-1);
  const correct=`${n}/${d}`;
  const cand=new Set();
  if(d-n>0 && d-n!==n) cand.add(`${d-n}/${d}`);
  if(d+1<=10) cand.add(`${n}/${d+1}`);
  if(d-1>=2) cand.add(`${n}/${d-1}`);
  cand.add(`${d}/${n}`);
  if(n+1<d) cand.add(`${n+1}/${d}`);
  if(n-1>0) cand.add(`${n-1}/${d}`);
  cand.delete(correct);
  let distractors=shuffle([...cand]).slice(0,3);
  while(distractors.length<3){
    const dd=randInt(2,8), nn=randInt(1,dd-1);
    const c=`${nn}/${dd}`;
    if(c!==correct && !distractors.includes(c)) distractors.push(c);
  }
  const options=shuffle([correct,...distractors]).map(o=>({label:o,correct:o===correct}));
  return {
    type:'identify',
    prompt:'Какая дробь закрашена?',
    visual:`<div class="identify-visual">${fractionBar(n,d)}</div>`,
    options,
    explanation:`Полоска разделена на ${d} равных частей, закрашено ${n}. Значит, закрашено ${n}/${d} всей полоски.`
  };
}

function makeAdd(){
  const d=randInt(3,9);
  const n1=randInt(1,Math.floor((d-1)/2));
  const n2=randInt(1,Math.floor((d-1)/2));
  const sum=n1+n2, correct=`${sum}/${d}`;
  const cand=new Set();
  cand.add(`${sum}/${d+d}`);
  if(sum+1<d) cand.add(`${sum+1}/${d}`);
  if(sum-1>0) cand.add(`${sum-1}/${d}`);
  cand.add(`${n1*n2}/${d}`);
  cand.delete(correct);
  let distractors=shuffle([...cand]).slice(0,3);
  while(distractors.length<3){
    const nn=randInt(1,d-1), c=`${nn}/${d}`;
    if(c!==correct && !distractors.includes(c)) distractors.push(c);
  }
  const options=shuffle([correct,...distractors]).map(o=>({label:o,correct:o===correct}));
  return {
    type:'add',
    prompt:'Сложи дроби:',
    visual:`
      <div class="identify-visual">
        ${fractionBarDual(n1,n2,d)}
        <div class="bar-legend">
          <span><i class="dot dot-a"></i>${fracHTML(n1,d)}</span>
          <span class="plus">+</span>
          <span><i class="dot dot-b"></i>${fracHTML(n2,d)}</span>
          <span class="eq">= ?</span>
        </div>
      </div>`,
    options,
    explanation:`Знаменатели одинаковые, поэтому складываем числители: ${n1} + ${n2} = ${sum}. Получаем ${sum}/${d}.`
  };
}

function buildQuestionSet(){
  const gens=[makeCompare,makeCompare,makeIdentify,makeIdentify,makeAdd,makeAdd];
  const shuffled=shuffle(gens);
  const qs=[];
  for(let i=0;i<8;i++) qs.push(shuffled[i%shuffled.length]());
  return qs;
}

/* ---------- Состояние ---------- */
const state={screen:'start',questions:[],current:0,score:0,bestStreak:0,streak:0,answered:false,selectedIndex:null};

/* ---------- Рендеринг ---------- */
function render(){
  const app=document.getElementById('app');
  if(state.screen==='start') app.innerHTML=renderStart();
  else if(state.screen==='quiz') app.innerHTML=renderQuiz();
  else app.innerHTML=renderResult();
}

function renderStart(){
  return `
    <section class="hero">
      <div class="badge">Математика · 5–6 класс</div>
      <h1>Дроби без стресса</h1>
      <p class="lead">
        8 коротких заданий, чтобы разобраться в сравнении, записи и сложении дробей.
        Наглядные полоски и понятное объяснение после каждого ответа — а не просто «правильно / неправильно».
      </p>
      <div class="features">
        <div class="feature"><span class="icon">👀</span>Наглядные полоски</div>
        <div class="feature"><span class="icon">💡</span>Объяснения после ответа</div>
        <div class="feature"><span class="icon">⚡</span>8 заданий за 5 минут</div>
      </div>
      <button class="btn btn-primary" data-action="start">Начать тренировку →</button>
    </section>`;
}

function renderQuiz(){
  const q=state.questions[state.current];
  const total=state.questions.length;
  const progress=((state.current+(state.answered?1:0))/total)*100;
  const isCompare=q.type==='compare';
  return `
    <div class="quiz-header">
      <div class="quiz-meta">
        <span class="quiz-step">Задание ${state.current+1} из ${total}</span>
        <span class="quiz-score">⭐ ${state.score}</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
    </div>
    <section class="card">
      <div class="question-prompt">${q.prompt}</div>
      ${q.visual||''}
      <div class="options ${isCompare?'compare-options':'fraction-options'}">
        ${q.options.map((o,i)=>renderOption(o,i)).join('')}
      </div>
      ${state.answered?renderFeedback(q):''}
    </section>`;
}

function renderOption(o,i){
  let cls='option';
  if(state.answered){
    if(o.correct) cls+=' correct';
    else if(i===state.selectedIndex) cls+=' wrong';
    else cls+=' dimmed';
  }
  return `<button class="${cls}" data-action="answer" data-index="${i}" ${state.answered?'disabled':''}>${renderLabel(o.label)}</button>`;
}

function renderFeedback(q){
  const ok=q.options[state.selectedIndex].correct;
  const isLast=state.current===state.questions.length-1;
  return `
    <div class="feedback ${ok?'ok':'bad'}">
      <div class="feedback-icon">${ok?'✓':'✗'}</div>
      <div class="feedback-body">
        <div class="feedback-title">${ok?'Верно!':'Не совсем'}</div>
        <div class="feedback-text">${q.explanation}</div>
      </div>
    </div>
    <div class="next-wrap">
      <button class="btn btn-primary" data-action="next">
        ${isLast?'Показать результат →':'Следующее задание →'}
      </button>
    </div>`;
}

function renderResult(){
  const total=state.questions.length;
  const pct=Math.round((state.score/total)*100);
  let emoji,title,message;
  if(pct===100){emoji='🏆';title='Идеально!';message='Все 8 из 8. Ты уверенно разбираешься в дробях!';}
  else if(pct>=75){emoji='🌟';title='Отличный результат!';message='Дроби почти освоены. Ещё немного практики — и будет идеально.';}
  else if(pct>=50){emoji='👍';title='Хороший старт!';message='Уже многое получается. Пройди ещё раз — и результат вырастет.';}
  else{emoji='💪';title='Главное — практика';message='Дроби — это навык. Попробуй ещё раз: с каждым проходом будет понятнее.';}
  return `
    <section class="result">
      <span class="result-emoji">${emoji}</span>
      <h2>${title}</h2>
      <div class="result-score">${state.score} / ${total}</div>
      ${state.bestStreak>=3?`<p class="result-streak">🔥 Лучшая серия подряд: ${state.bestStreak}</p>`:''}
      <p class="result-message">${message}</p>
      <button class="btn btn-primary" data-action="restart">Пройти ещё раз →</button>
    </section>`;
}

/* ---------- Действия ---------- */
function startGame(){
  state.questions=buildQuestionSet();
  state.current=0; state.score=0; state.streak=0; state.bestStreak=0;
  state.answered=false; state.selectedIndex=null; state.screen='quiz';
  render();
}
function answer(index){
  if(state.answered) return;
  const q=state.questions[state.current];
  state.answered=true; state.selectedIndex=index;
  if(q.options[index].correct){state.score++;state.streak++;state.bestStreak=Math.max(state.bestStreak,state.streak);}
  else state.streak=0;
  render();
}
function next(){
  if(!state.answered) return;
  if(state.current===state.questions.length-1) state.screen='result';
  else{state.current++;state.answered=false;state.selectedIndex=null;}
  render();
}

/* ---------- События ---------- */
document.getElementById('app').addEventListener('click',e=>{
  const btn=e.target.closest('[data-action]');
  if(!btn) return;
  const a=btn.dataset.action;
  if(a==='start'||a==='restart') startGame();
  else if(a==='answer') answer(Number(btn.dataset.index));
  else if(a==='next') next();
});
document.addEventListener('keydown',e=>{
  if(state.screen!=='quiz') return;
  const q=state.questions[state.current];
  if(!state.answered){
    const n=parseInt(e.key,10);
    if(n>=1 && n<=q.options.length){e.preventDefault();answer(n-1);}
  } else if(e.key==='Enter'||e.key===' '){e.preventDefault();next();}
});

render();
</script>
</body>
</html>
